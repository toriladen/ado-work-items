name: Refresh ADO Work Items

on:
  schedule:
    - cron: "0 15 * * *"   # 11:00 AM ET (UTC-4 EDT)
    - cron: "0 20 * * *"   # 4:00 PM ET (UTC-4 EDT)
  workflow_dispatch:         # allow manual trigger from GitHub Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Query ADO and update index.html
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
        run: python refresh.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: refresh ADO work items [skip ci]"
          git push
