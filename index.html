<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Data Troopers — Recent Work Items</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
      padding: 2rem;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    h1 { font-size: 1.4rem; font-weight: 700; color: #111827; }

    .subtitle {
      font-size: 0.8rem;
      color: #6b7280;
      margin-top: 0.2rem;
    }

    .meta {
      font-size: 0.8rem;
      color: #6b7280;
      text-align: right;
      line-height: 1.6;
      white-space: nowrap;
    }

    .meta strong { font-weight: 600; color: #4b5563; }

    /* Error banner — shown only when the ADO query fails. */
    #banner {
      display: none;
      align-items: flex-start;
      gap: 0.6rem;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-left: 4px solid #dc2626;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.85rem;
      color: #991b1b;
    }

    #banner.visible { display: flex; }
    #banner .b-title { font-weight: 700; display: block; margin-bottom: 0.15rem; }
    #banner .b-detail { color: #b91c1c; font-size: 0.78rem; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    /* Dim the rows when what's on screen is known to be out of date. */
    table.stale { opacity: 0.55; }

    thead { background: #1e3a5f; color: #ffffff; }

    thead th {
      padding: 0.75rem 1rem;
      text-align: left;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid #e5e7eb;
      transition: background 0.15s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f9fafb; }

    td { padding: 0.7rem 1rem; font-size: 0.875rem; vertical-align: middle; }

    .id-cell a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
      font-family: monospace;
      font-size: 0.82rem;
    }

    .id-cell a:hover { text-decoration: underline; }

    .title-cell { max-width: 380px; }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .type-Task       { background: #dbeafe; color: #1d4ed8; }
    .type-UserStory  { background: #d1fae5; color: #065f46; }
    .type-SpikeStory { background: #ede9fe; color: #5b21b6; }
    .type-Bug        { background: #fee2e2; color: #991b1b; }
    .type-Feature    { background: #fef3c7; color: #92400e; }
    .type-default    { background: #f3f4f6; color: #374151; }

    .state-New           { background: #e5e7eb; color: #374151; }
    .state-DevInProgress { background: #dbeafe; color: #1d4ed8; }
    .state-Active        { background: #d1fae5; color: #065f46; }
    .state-Closed        { background: #f3f4f6; color: #9ca3af; }
    .state-Resolved      { background: #d1fae5; color: #065f46; }
    .state-ReadyForMerge { background: #d1fae5; color: #065f46; }
    .state-Blocked       { background: #fee2e2; color: #991b1b; }
    .state-default       { background: #fef3c7; color: #92400e; }

    .date-cell { white-space: nowrap; color: #4b5563; }
    .assignee-cell { white-space: nowrap; }
    .unassigned { color: #9ca3af; font-style: italic; font-size: 0.8rem; }

    .message-row td {
      text-align: center;
      color: #9ca3af;
      font-style: italic;
      padding: 1.75rem 1rem;
    }

    .refresh-bar {
      margin-top: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.8rem;
      color: #6b7280;
    }

    .progress-track {
      flex: 1;
      max-width: 240px;
      height: 4px;
      background: #e5e7eb;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #2563eb;
      border-radius: 2px;
      width: 0%;
      transition: width 1s linear;
    }

    button#refresh-now {
      margin-left: auto;
      padding: 0.35rem 0.85rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
    }

    button#refresh-now:hover:not(:disabled) { background: #1d4ed8; }
    button#refresh-now:disabled { background: #9ca3af; cursor: default; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Team Data Troopers — Recent Work Items</h1>
    <div class="subtitle">
      Iteration: MSI\Team Data Troopers Backlog &nbsp;·&nbsp; Created in the last 7 days
    </div>
  </div>
  <div class="meta">
    Data as of: <strong id="data-as-of">loading…</strong><br>
    Next check: <strong id="next-refresh">—</strong>
  </div>
</header>

<div id="banner">
  <span>⚠</span>
  <div>
    <span class="b-title" id="banner-title"></span>
    <span class="b-detail" id="banner-detail"></span>
  </div>
</div>

<table id="wi-table">
  <thead>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Type</th>
      <th>State</th>
      <th>Created Date</th>
      <th>Assigned To</th>
    </tr>
  </thead>
  <tbody id="wi-tbody">
    <tr class="message-row"><td colspan="6">Loading work items from Azure DevOps…</td></tr>
  </tbody>
</table>

<div class="refresh-bar">
  <span>Next check in <span id="countdown">--:--</span></span>
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  <button id="refresh-now">Refresh Now</button>
</div>

<script>
  // The work items are fetched from /api/workitems on every load and every
  // POLL_MS thereafter. Nothing is baked into this file, so the page is current
  // whenever it is opened — no rebuild, no redeploy, no commit.
  const API = '/api/workitems';
  const POLL_MS = 15 * 60 * 1000;   // 15 minutes
  const ADO_BASE = 'https://millenniumsi.visualstudio.com';
  const PROJECT = 'MSI';

  const el = (id) => document.getElementById(id);
  let countdownTimer, pollTimer, nextCheckAt, haveData = false;

  const TYPE_CLASS = {
    'Task': 'type-Task',
    'User Story': 'type-UserStory',
    'Spike Story': 'type-SpikeStory',
    'Bug': 'type-Bug',
    'Feature': 'type-Feature',
  };

  const STATE_CLASS = {
    'New': 'state-New',
    'Dev In Progress': 'state-DevInProgress',
    'Active': 'state-Active',
    'Closed': 'state-Closed',
    'Resolved': 'state-Resolved',
    'Ready For Merge': 'state-ReadyForMerge',
    'Blocked': 'state-Blocked',
  };

  function escHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function formatDate(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return escHtml(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
      + ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }

  function renderRows(items) {
    const tbody = el('wi-tbody');

    if (!items.length) {
      tbody.innerHTML =
        '<tr class="message-row"><td colspan="6">No work items created in the last 7 days.</td></tr>';
      return;
    }

    tbody.innerHTML = items.map((item) => {
      const url = `${ADO_BASE}/${PROJECT}/_workitems/edit/${item.id}`;
      const assignee = item.assignedTo
        ? `<span>${escHtml(item.assignedTo)}</span>`
        : '<span class="unassigned">Unassigned</span>';
      return `<tr>
        <td class="id-cell"><a href="${url}" target="_blank" rel="noopener">#${item.id}</a></td>
        <td class="title-cell">${escHtml(item.title)}</td>
        <td><span class="badge ${TYPE_CLASS[item.type] || 'type-default'}">${escHtml(item.type)}</span></td>
        <td><span class="badge ${STATE_CLASS[item.state] || 'state-default'}">${escHtml(item.state)}</span></td>
        <td class="date-cell">${formatDate(item.created)}</td>
        <td class="assignee-cell">${assignee}</td>
      </tr>`;
    }).join('');
  }

  function showError(title, detail) {
    el('banner-title').textContent = title;
    el('banner-detail').textContent = detail || '';
    el('banner').classList.add('visible');
    // Anything already on screen is now known to be out of date.
    el('wi-table').classList.add('stale');
    if (!haveData) {
      el('wi-tbody').innerHTML =
        '<tr class="message-row"><td colspan="6">Could not load work items.</td></tr>';
    }
  }

  function clearError() {
    el('banner').classList.remove('visible');
    el('wi-table').classList.remove('stale');
  }

  async function loadData() {
    const btn = el('refresh-now');
    btn.disabled = true;
    btn.textContent = 'Refreshing…';

    try {
      // Cache-bust so neither the CDN nor the SharePoint iframe can serve an old copy.
      const res = await fetch(`${API}?t=${Date.now()}`, { cache: 'no-store' });
      const body = await res.json().catch(() => null);

      if (!res.ok || !body || !body.ok) {
        showError(
          (body && body.error) || `Request failed (HTTP ${res.status}).`,
          (body && (body.hint || body.detail)) || ''
        );
      } else {
        renderRows(body.items);
        haveData = true;
        clearError();
        // Stamped by the server at query time, so it reflects the data, not the clock.
        el('data-as-of').textContent = new Date(body.fetchedAt).toLocaleString();
      }
    } catch (e) {
      showError('Could not reach the work item service.', e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Refresh Now';
      scheduleNextCheck();
    }
  }

  function scheduleNextCheck() {
    clearTimeout(pollTimer);
    clearInterval(countdownTimer);

    nextCheckAt = Date.now() + POLL_MS;
    pollTimer = setTimeout(loadData, POLL_MS);
    el('next-refresh').textContent = new Date(nextCheckAt).toLocaleTimeString();

    countdownTimer = setInterval(() => {
      const remaining = Math.max(0, nextCheckAt - Date.now());
      const m = Math.floor(remaining / 60000);
      const s = Math.floor((remaining % 60000) / 1000);
      el('countdown').textContent =
        String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      el('progress-fill').style.width = (((POLL_MS - remaining) / POLL_MS) * 100) + '%';
      if (remaining === 0) clearInterval(countdownTimer);
    }, 1000);
  }

  el('refresh-now').addEventListener('click', loadData);
  loadData();
</script>
</body>
</html>
