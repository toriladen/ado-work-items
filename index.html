<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Data Troopers — Recent Work Items</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
      padding: 2rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #111827;
    }

    .meta {
      font-size: 0.8rem;
      color: #6b7280;
      text-align: right;
      line-height: 1.6;
    }

    .meta span#next-refresh { font-weight: 600; color: #4b5563; }
    .meta span#data-as-of   { font-weight: 600; color: #4b5563; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    thead {
      background: #1e3a5f;
      color: #ffffff;
    }

    thead th {
      padding: 0.75rem 1rem;
      text-align: left;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid #e5e7eb;
      transition: background 0.15s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f9fafb; }

    td {
      padding: 0.7rem 1rem;
      font-size: 0.875rem;
      vertical-align: middle;
    }

    .id-cell a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
      font-family: monospace;
      font-size: 0.82rem;
    }

    .id-cell a:hover { text-decoration: underline; }

    .title-cell { max-width: 340px; }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Work Item Type badges */
    .type-Task          { background: #dbeafe; color: #1d4ed8; }
    .type-UserStory     { background: #d1fae5; color: #065f46; }
    .type-SpikeStory    { background: #ede9fe; color: #5b21b6; }
    .type-Bug           { background: #fee2e2; color: #991b1b; }
    .type-Feature       { background: #fef3c7; color: #92400e; }
    .type-default       { background: #f3f4f6; color: #374151; }

    /* State badges */
    .state-New              { background: #e5e7eb; color: #374151; }
    .state-DevInProgress    { background: #dbeafe; color: #1d4ed8; }
    .state-Active           { background: #d1fae5; color: #065f46; }
    .state-Closed           { background: #f3f4f6; color: #9ca3af; }
    .state-Resolved         { background: #d1fae5; color: #065f46; }
    .state-default          { background: #fef3c7; color: #92400e; }

    .date-cell { white-space: nowrap; color: #4b5563; }
    .assignee-cell { white-space: nowrap; }
    .unassigned { color: #9ca3af; font-style: italic; font-size: 0.8rem; }

    .empty-row td {
      text-align: center;
      color: #9ca3af;
      font-style: italic;
      padding: 1.5rem 1rem;
    }

    .refresh-bar {
      margin-top: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.8rem;
      color: #6b7280;
    }

    .progress-track {
      flex: 1;
      max-width: 260px;
      height: 4px;
      background: #e5e7eb;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #2563eb;
      border-radius: 2px;
      width: 0%;
      transition: width 1s linear;
    }

    button#refresh-now {
      margin-left: auto;
      padding: 0.35rem 0.85rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
    }

    button#refresh-now:hover { background: #1d4ed8; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Team Data Troopers — Recent Work Items</h1>
    <div style="font-size:0.8rem;color:#6b7280;margin-top:0.2rem;">
      Iteration: MSI\Team Data Troopers Backlog &nbsp;·&nbsp; Created in last 7 days
    </div>
  </div>
  <div class="meta">
    Data as of: <span id="data-as-of">—</span><br>
    Next refresh: <span id="next-refresh">—</span>
  </div>
</header>

<table id="wi-table">
  <thead>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Type</th>
      <th>State</th>
      <th>Created Date</th>
      <th>Assigned To</th>
    </tr>
  </thead>
  <tbody id="wi-tbody">
    <!-- populated by JS from WORK_ITEMS below -->
  </tbody>
</table>

<div class="refresh-bar">
  <span>Auto-refresh in <span id="countdown">--:--:--</span></span>
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  <button id="refresh-now" onclick="hardReload()">Refresh Now</button>
</div>

<script>
  const PROJECT  = 'MSI';
  const ADO_BASE = 'https://millenniumsi.visualstudio.com';

  // ─────────────────────────────────────────────────────────────────────────────
  // Data below is written by refresh.py during the GitHub Actions run, then
  // deployed by Netlify. The page does NOT call ADO at runtime — a static page
  // has no ADO credentials, so any browser-side query would always fail.
  // DATA_AS_OF is stamped at the same moment, so staleness is visible on screen.
  // ─────────────────────────────────────────────────────────────────────────────
  const DATA_AS_OF = "not yet refreshed";
  const WORK_ITEMS = [
    { id: 138784, title: "Boulevard Update - Product Screen: Need to update Playbook and Mapping", type: "Task", state: "New", created: "2026-08-21T20:51:07.89Z", assignedTo: "" },
    { id: 138779, title: "DataMate - Boulevard - Add ThirdpartyID and Appointments Include Current Day", type: "User Story", state: "New", created: "2026-08-21T20:18:28.003Z", assignedTo: "" },
  ];

  let refreshTimer, countdownTimer;

  function typeClass(t) {
    const map = { "Task": "type-Task", "User Story": "type-UserStory", "Spike Story": "type-SpikeStory", "Bug": "type-Bug", "Feature": "type-Feature" };
    return map[t] || "type-default";
  }

  function stateClass(s) {
    const map = { "New": "state-New", "Dev In Progress": "state-DevInProgress", "Active": "state-Active", "Closed": "state-Closed", "Resolved": "state-Resolved" };
    return map[s] || "state-default";
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatDate(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return escHtml(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
      + ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }

  function renderRows(items) {
    const tbody = document.getElementById('wi-tbody');
    if (!items.length) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="6">No work items created in the last 7 days.</td></tr>';
      return;
    }
    tbody.innerHTML = items.map(item => {
      const wiUrl = `${ADO_BASE}/${PROJECT}/_workitems/edit/${item.id}`;
      const assignee = item.assignedTo
        ? `<span>${escHtml(item.assignedTo)}</span>`
        : `<span class="unassigned">Unassigned</span>`;
      return `<tr>
        <td class="id-cell"><a href="${wiUrl}" target="_blank" rel="noopener">#${item.id}</a></td>
        <td class="title-cell">${escHtml(item.title)}</td>
        <td><span class="badge ${typeClass(item.type)}">${escHtml(item.type)}</span></td>
        <td><span class="badge ${stateClass(item.state)}">${escHtml(item.state)}</span></td>
        <td class="date-cell">${formatDate(item.created)}</td>
        <td class="assignee-cell">${assignee}</td>
      </tr>`;
    }).join('');
  }

  function showDataAsOf() {
    const el = document.getElementById('data-as-of');
    const d = new Date(DATA_AS_OF);
    el.textContent = isNaN(d) ? DATA_AS_OF : d.toLocaleString();
  }

  // Milliseconds until the next 4:00 PM America/New_York (handles EDT/EST).
  function msUntilNext4pmET() {
    const now = new Date();
    const etNow = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
    const target = new Date(etNow);
    target.setHours(16, 0, 0, 0);
    if (etNow >= target) target.setDate(target.getDate() + 1);
    return target - etNow;
  }

  // Re-request the page so we pick up the freshly deployed WORK_ITEMS.
  // Re-rendering the in-memory array would show the same stale rows forever —
  // which is what made an embedded SharePoint iframe go stale for days.
  function hardReload() {
    const u = new URL(window.location.href);
    u.searchParams.set('_', Date.now().toString());  // bypass iframe/CDN cache
    window.location.replace(u.toString());
  }

  function scheduleNextRefresh() {
    clearTimeout(refreshTimer);
    clearInterval(countdownTimer);

    const wait = msUntilNext4pmET();   // recomputed each cycle, so it never drifts
    const endTime = Date.now() + wait;

    refreshTimer = setTimeout(hardReload, wait);
    document.getElementById('next-refresh').textContent = new Date(endTime).toLocaleString();

    countdownTimer = setInterval(() => {
      const remaining = Math.max(0, endTime - Date.now());
      const h = Math.floor(remaining / 3600000);
      const m = Math.floor((remaining % 3600000) / 60000);
      const s = Math.floor((remaining % 60000) / 1000);
      document.getElementById('countdown').textContent =
        String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      document.getElementById('progress-fill').style.width =
        (((wait - remaining) / wait) * 100) + '%';
      if (remaining === 0) clearInterval(countdownTimer);
    }, 1000);
  }

  renderRows(WORK_ITEMS);
  showDataAsOf();
  scheduleNextRefresh();
</script>
</body>
</html>
